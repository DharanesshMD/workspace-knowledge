[workspace]
members = ["crates/contracts", "crates/scope", "crates/local", "crates/capture", "crates/cli", "crates/knowledge", "crates/server", "crates/mcp", "crates/adapters", "crates/summarize", "crates/agent", "crates/environments"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
sha2 = "0.10"
