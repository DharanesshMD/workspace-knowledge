# Extend every default rule. Each exception below requires BOTH an exact test
# file and the entire reviewed synthetic source line; other values still fail.
[extend]
useDefault = true

# A Workspace Knowledge personal MCP token (a bearer credential): catch one pasted into a file.
[[rules]]
id = "wk-personal-token"
description = "Workspace Knowledge personal MCP token"
regex = '''wkpt_[0-9a-f]{64}'''
keywords = ["wkpt_"]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact reviewed synthetic private-note rejection canary across merges"
condition = "AND"
regexTarget = "line"
paths = ['''^crates/knowledge/tests/personal\.rs$''']
regexes = ['''^\s*\+?\s*secret\.body\.intent\ =\ "sk\-proj\-THIS_IS_A_SYNTHETIC_SECRET_CANARY_012345678901234567890"\.into\(\);\s*$''']

[[rules.allowlists]]
description = "Reviewed synthetic masking examples for the history redaction tests"
condition = "AND"
regexTarget = "line"
paths = ['''^crates/adapters/tests/cursor_history\.rs$''']
regexes = [
  '''^\s*\+?\s*redact\("token=sk\-SYNTHETICabcdef1234567890\ ok"\),\s*$''',
  '''^\s*\+?\s*"key=sk\-SYNTHETICabcdef1234567890\ and\ ghp_abcdefghijklmnop1234\ ok",\s*$''',
  '''^\s*\+?\s*"secretAccessKey=wJalrXUtn/K7MDENG/bPxRfi",\s*$''',
]

[[rules.allowlists]]
description = "Reviewed synthetic CLI masking canary"
condition = "AND"
regexTarget = "line"
paths = ['''^crates/cli/tests/cli\.rs$''']
regexes = [
  '''^\s*\+?\s*const\ SECRET:\ \&str\ =\ "password=SYNTHETIC_SECRET_0123456789abcdefghij";\s*$''',
]

[[rules.allowlists]]
description = "Keycloak database host name in a JDBC URL (the password comes from the environment)"
condition = "AND"
regexTarget = "line"
paths = ['''^deploy/compose/keycloak\.yaml$''']
regexes = [
  '''^\s*\+?\s*KC_DB_URL:\ jdbc:postgresql://keycloak\-postgres:5432/keycloak\s*$''',
]

[[rules.allowlists]]
description = "Reviewed synthetic idempotency key (a made-up UUID) in the privacy corpus"
condition = "AND"
regexTarget = "line"
paths = ['''^crates/summarize/tests/privacy\.rs$''']
regexes = [
  '''^\s*\+?\s*r\#"\{"idempotency_key":"3f2a9c1e\-1234\-5678\-90ab\-cdef01234567"\}"\#,\s*$''',
]

[[rules]]
id = "curl-auth-user"

[[rules.allowlists]]
description = "Reviewed synthetic curl credential examples for the history redaction tests"
condition = "AND"
regexTarget = "line"
paths = ['''^crates/adapters/tests/cursor_history\.rs$''']
regexes = [
  '''^\s*\+?\s*"curl\ \-u\ alice:s3cret\ https://x\.test",\s*$''',
  '''^\s*\+?\s*"curl\ \-\-user=alice:pw\ url",\s*$''',
]
