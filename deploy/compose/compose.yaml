# On-prem Linux deployment. Provision secrets externally; no default credentials.
services:
  postgres:
    image: postgres:17-bookworm
    cpus: '${WK_DB_CPUS:-2}'
    mem_limit: '${WK_DB_MEMORY:-2g}'
    pids_limit: 256
    command: [postgres, -c, max_connections=50, -c, shared_buffers=256MB, -c, work_mem=4MB]
    environment:
      POSTGRES_DB: workspace_knowledge
      POSTGRES_USER: wk_owner
      POSTGRES_PASSWORD: ${WK_POSTGRES_PASSWORD:?Set a strong database owner password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wk_owner -d workspace_knowledge']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    cpus: '${WK_APP_CPUS:-2}'
    mem_limit: '${WK_APP_MEMORY:-1g}'
    pids_limit: 256
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    environment:
      WK_DATABASE_URL: ${WK_DATABASE_URL:?Set an application role connection URL}
      WK_OIDC_ISSUER: ${WK_OIDC_ISSUER:?Set HTTPS OIDC issuer}
      WK_OIDC_AUDIENCE: ${WK_OIDC_AUDIENCE:?Set OIDC audience}
      WK_OIDC_JWKS_URL: ${WK_OIDC_JWKS_URL:?Set HTTPS JWKS endpoint}
      WK_COLLECTOR_AUDIENCE: ${WK_COLLECTOR_AUDIENCE:?Set distinct collector OIDC audience}
      WK_COLLECTOR_CLIENT_ID: ${WK_COLLECTOR_CLIENT_ID:?Set registered native public-client ID}
      WK_BROWSER_CLIENT_ID: ${WK_BROWSER_CLIENT_ID:?Set registered browser OIDC client ID}
      WK_BROWSER_CLIENT_SECRET: ${WK_BROWSER_CLIENT_SECRET:-}
      # Only for an identity provider behind a private CA: mount the PEM bundle read-only (for
      # example with a compose override) and set this to its in-container path.
      WK_OIDC_CA_FILE: ${WK_OIDC_CA_FILE:-}
      # Remote MCP and `wk-mcp login`: the public HTTPS origin (no trailing slash), which must also
      # be the API audience, and the public client that `wk-mcp login` signs in with.
      WK_MCP_RESOURCE: ${WK_MCP_RESOURCE:-}
      WK_MCP_CLIENT_ID: ${WK_MCP_CLIENT_ID:-}
      # Personal MCP tokens, off by default. `1` lets each developer create revocable tokens in the portal
      # that authenticate to the hosted MCP address of one product only (never the REST API); the
      # lifetime cap is 1 to 365 days. Disabling it makes the server reject every existing token.
      WK_PERSONAL_TOKENS: ${WK_PERSONAL_TOKENS:-0}
      WK_PERSONAL_TOKEN_MAX_DAYS: ${WK_PERSONAL_TOKEN_MAX_DAYS:-90}
      WK_AUTO_PUBLISH_PRODUCTS: ${WK_AUTO_PUBLISH_PRODUCTS:-}
      WK_BIND: 0.0.0.0:8080
      WK_CONSOLE_ORIGIN: ${WK_CONSOLE_ORIGIN:?Set exact HTTPS console origin}
      WK_POOL_MAX: '${WK_POOL_MAX:-10}'
      WK_DB_ACQUIRE_MS: '${WK_DB_ACQUIRE_MS:-5000}'
      WK_DB_STATEMENT_MS: '${WK_DB_STATEMENT_MS:-5000}'
      WK_DB_LOCK_MS: '${WK_DB_LOCK_MS:-3000}'
      WK_MAX_INFLIGHT: '${WK_MAX_INFLIGHT:-64}'
      WK_HTTP_TIMEOUT_SECONDS: '${WK_HTTP_TIMEOUT_SECONDS:-30}'
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    healthcheck:
      test: [CMD, wk-server, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
volumes:
  postgres:
