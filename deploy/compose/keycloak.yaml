# Optional Keycloak for a small team, with the Workspace Knowledge starter realm imported on first
# start. Use it together with compose.yaml:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/keycloak.yaml up -d keycloak
# Setup and the realm's contents: docs/operations/quick-start-keycloak.md
services:
  keycloak-postgres:
    image: postgres:17-bookworm
    mem_limit: 512m
    pids_limit: 128
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${WK_KEYCLOAK_DB_PASSWORD:?Set a strong Keycloak database password}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start
      - --import-realm
      - --hostname=${WK_KEYCLOAK_ORIGIN:?Set the public HTTPS origin of Keycloak}
      - --https-certificate-file=/certs/tls.crt
      - --https-certificate-key-file=/certs/tls.key
      - --http-enabled=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${WK_KEYCLOAK_ADMIN_PASSWORD:?Set a strong Keycloak admin password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${WK_KEYCLOAK_DB_PASSWORD}
      # Substituted into the imported realm's ${...} placeholders; the same names the app uses.
      WK_CONSOLE_ORIGIN: ${WK_CONSOLE_ORIGIN:?Set exact HTTPS console origin}
      WK_BROWSER_CLIENT_SECRET: ${WK_BROWSER_CLIENT_SECRET:?Set the portal client secret}
      WK_OIDC_AUDIENCE: ${WK_OIDC_AUDIENCE:?Set OIDC audience}
      WK_COLLECTOR_AUDIENCE: ${WK_COLLECTOR_AUDIENCE:?Set distinct collector OIDC audience}
    volumes:
      - ../keycloak/wk-realm.json:/opt/keycloak/data/import/wk-realm.json:ro
      - ${WK_KEYCLOAK_CERT:?Path to the Keycloak TLS certificate chain (PEM)}:/certs/tls.crt:ro
      - ${WK_KEYCLOAK_KEY:?Path to the Keycloak TLS private key (PEM)}:/certs/tls.key:ro
    ports: ['${WK_KEYCLOAK_BIND:-127.0.0.1:8443}:8443']
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
volumes:
  keycloak-postgres:
