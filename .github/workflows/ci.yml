name: Foundation checks
on:
  # Run once per change: on main, on pull requests, or on demand (not on every branch push).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: python3 -m unittest discover -s scripts/tests -v
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo test --locked -p wk-summarize --example privacy_acceptance
      - run: cargo test --locked -p wk-server --example hosted_pilot
      - run: cargo build --workspace --locked
      - if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated supported Claude host fixture
        if: runner.os == 'macOS'
        run: npm install --prefix "$RUNNER_TEMP/wk-claude-host" @anthropic-ai/claude-code@2.1.296 --no-audit --no-fund
      - name: Verify native Edit and Write denial, hook crash and timeout
        if: runner.os == 'macOS'
        run: |
          python3 scripts/code-context-host.py --claude "$RUNNER_TEMP/wk-claude-host/node_modules/.bin/claude" --agent target/debug/wk-agent --tool Edit
          python3 scripts/code-context-host.py --claude "$RUNNER_TEMP/wk-claude-host/node_modules/.bin/claude" --agent target/debug/wk-agent --tool Write

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wk_test
          POSTGRES_PASSWORD: wk-test-only
          POSTGRES_DB: wk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wk_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WK_TEST_DATABASE_URL: postgres://wk_test:wk-test-only@127.0.0.1:5432/wk_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo test --workspace --locked -- --include-ignored
      - run: cargo build --workspace --locked
      - run: python3 scripts/integration.py
      - run: python3 scripts/demo.py
      - run: python3 scripts/code-context-live.py

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build && npm test
        working-directory: web

  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux amd64 runtime candidate
        run: docker build --platform linux/amd64 --target runtime -f deploy/Dockerfile -t wk-candidate:${{ github.sha }} .
      - name: Check non-root assets and fail-closed production startup
        run: |
          set -euo pipefail
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --entrypoint /bin/sh wk-candidate:${{ github.sha }} \
            -c 'test "$(id -u)" = 10001 && test -r /opt/wk/web/index.html && test -x /usr/local/bin/wk-server'
          if docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            wk-candidate:${{ github.sha }} --production 2> "$RUNNER_TEMP/missing-config.log"; then
            echo '::error::Production startup unexpectedly accepted missing configuration.'
            exit 1
          fi
          grep -Fx 'WK_DATABASE_URL required' "$RUNNER_TEMP/missing-config.log"

  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo build -p wk-environments --locked
      - name: Start disposable TLS vault
        run: >-
          docker run --detach --name wk-final-bao
          -e BAO_DEV_ROOT_TOKEN_ID=wk-synthetic-root -p 127.0.0.1::8200
          --entrypoint sh openbao/openbao:2.4.3
          -c 'mkdir -p /tmp/wk-tls && exec bao server -dev -dev-tls -dev-tls-cert-dir=/tmp/wk-tls -dev-listen-address=0.0.0.0:8200 -dev-no-store-token'
      - run: python3 scripts/environment-integration.py
      - if: always()
        run: docker rm -f wk-final-bao
