[package]
name = "wk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wk-knowledge = {path="../knowledge"}
wk-contracts = {path="../contracts"}
axum = "0.8"
tokio = { version="1", features=["macros","rt-multi-thread","net","signal"] }
uuid = { version="1",features=["serde"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
openidconnect = { version = "4.0.1", default-features = false }
rand = "0.8"
wk-summarize={path="../summarize"}
tower-http={version="0.6",features=["fs","set-header"]}
rmcp={version="3.5",features=["transport-streamable-http-server"]}
tower = {version="0.5",features=["util"]}
ed25519-dalek="2"
hex="0.4"
[dev-dependencies]
http-body-util = "0.1"
sqlx = {version="0.8",default-features=false,features=["runtime-tokio","postgres"]}
