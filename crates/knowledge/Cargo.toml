[package]
name = "wk-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
schemars = "1.2.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wk-contracts = { path = "../contracts" }
wk-summarize = { path = "../summarize" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

url = "2"

ed25519-dalek = "2"
hex = "0.4"
