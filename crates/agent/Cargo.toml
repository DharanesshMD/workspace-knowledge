[package]
name="wk-agent"
version.workspace=true
edition.workspace=true
license.workspace=true
[dependencies]
serde.workspace=true
serde_json.workspace=true
sha2.workspace=true
tempfile.workspace=true
wk-local={path="../local"}
wk-scope={path="../scope"}
wk-capture={path="../capture"}
wk-adapters={path="../adapters"}
wk-summarize={path="../summarize"}
wk-contracts={path="../contracts"}
wk-login={path="../login"}
clap={version="4",features=["derive"]}
axum="0.8"
tokio={version="1",features=["full"]}
reqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}
keyring={version="3.6",features=["apple-native","windows-native","sync-secret-service","crypto-rust"]}
rand="0.8"
zeroize="1"
uuid={version="1",features=["v4"]}
ed25519-dalek="2"
hex="0.4"
openidconnect.workspace = true
[[bin]]
name="wk-agent"
path="src/main.rs"
[target.'cfg(unix)'.dependencies]
libc="0.2"
[dev-dependencies]
wk-login={path="../login",features=["test-support"]}
jsonwebtoken={version="10",features=["aws_lc_rs"]}
