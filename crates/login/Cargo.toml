[package]
name="wk-login"
version.workspace=true
edition.workspace=true
license.workspace=true
[features]
# Throwaway private-CA HTTPS server for tests in this and dependent crates.
test-support=["dep:axum","dep:rcgen","dep:tokio-rustls","dep:jsonwebtoken","dep:base64"]
[dependencies]
serde_json.workspace=true
openidconnect.workspace=true
reqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}
tokio={version="1",features=["net","time","io-util"]}
zeroize="1"
axum={version="0.8",optional=true}
rcgen={version="0.14",default-features=false,features=["pem","ring"],optional=true}
tokio-rustls={version="0.26",default-features=false,features=["ring"],optional=true}
jsonwebtoken={version="10",features=["aws_lc_rs"],optional=true}
base64={version="0.22",optional=true}
[dev-dependencies]
axum="0.8"
base64="0.22"
jsonwebtoken={version="10",features=["aws_lc_rs"]}
rcgen={version="0.14",default-features=false,features=["pem","ring"]}
tokio={version="1",features=["macros","rt-multi-thread"]}
tokio-rustls={version="0.26",default-features=false,features=["ring"]}
wk-summarize={path="../summarize"}
